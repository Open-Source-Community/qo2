name: QO2 Multi-Distro CI

on:
  push:
    branches: [ main, ctf-improvements ]
  pull_request:
    branches: [ main, ctf-improvements ]

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Run Go Unit Tests
        run: go test -v ./pkg/...

  multi-distro-matrix:
    name: Multi-Distro Build & Integration Matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro:
          - debian:bookworm
          - ubuntu:22.04
          - fedora:39
          - kalilinux/kali-rolling
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Run Distro Container Build & Test Verification
        run: |
          # SYS_ADMIN lets the root-gated sandbox tests bind-mount /dev/null
          # into the chroot (TestCheckSocketRoundTrip); it is not granted by default.
          docker run --rm --cap-add SYS_ADMIN -v ${{ github.workspace }}:/workspace -w /workspace ${{ matrix.distro }} /bin/bash -c "
            set -e
            if command -v apt-get >/dev/null; then
              apt-get update && apt-get install -y sqlite3 git tar zip gzip bzip2 curl
            elif command -v dnf >/dev/null; then
              dnf install -y sqlite git tar zip gzip bzip2 curl
            fi
            curl -fsSL https://go.dev/dl/go1.26.6.linux-amd64.tar.gz | tar -C /usr/local -xz
            export PATH=/usr/local/go/bin:\$PATH
            go version
            go test -v ./pkg/...
            go build -o qo main.go
            ./qo --help
            bash scripts/test-e2e.sh
          "
